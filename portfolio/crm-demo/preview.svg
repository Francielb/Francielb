<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title description">
<title id="title">MarineOps CRM conceptual portfolio interface</title>
<desc id="description">Illustrative, fictional dashboard design. Not a screenshot of the actual CRM. Shows four synthetic summary metrics, an opportunity radar and sample follow-ups.</desc>
<defs>
