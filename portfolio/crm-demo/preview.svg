<text x="273" y="99" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#142739" font-weight="bold">Sales &amp; service overview</text>
<text x="273" y="128" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#607a8b">A visual demonstration of business workflows modeled in a CRM project.</text>
